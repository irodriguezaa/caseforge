services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      RN_STORAGE_DIR: ${RN_STORAGE_DIR:-/app/data/release_notes}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_GRAPH_ACCESS_TOKEN: ${MS_GRAPH_ACCESS_TOKEN:-}
      MS_GRAPH_MAILBOX: ${MS_GRAPH_MAILBOX:-}
      MS_GRAPH_TIMEZONE: ${MS_GRAPH_TIMEZONE:-America/Mexico_City}
      MS_CALENDAR_ICS_URL: ${MS_CALENDAR_ICS_URL:-}
      MS_CALENDAR_ICS_PATH: ${MS_CALENDAR_ICS_PATH:-}
      MS_CALENDAR_ICS_QC_ONLY: ${MS_CALENDAR_ICS_QC_ONLY:-}
      QC_USERS: ${QC_USERS:-}
      QC_SESSION_SECRET: ${QC_SESSION_SECRET:-}
      QC_COOKIE_SECURE: ${QC_COOKIE_SECURE:-}
    volumes:
      - rn_notes:/app/data/release_notes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Test image (see backend/Dockerfile's `test` stage): only built/run when explicitly requested
  # via the `test` profile. Never starts with a plain `docker compose up`, so it cannot affect
  # the already-validated Sprint 1 flow. Usage:
  #   docker compose --profile test run --rm backend-test
  backend-test:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    environment:
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      QC_USERS: ${QC_USERS:-}
      QC_SESSION_SECRET: ${QC_SESSION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  rn_notes:
